name: Supabase Industrial Migrations

# Fail-closed: só workflow_dispatch + GitHub Environment = target.
# Allowlist canónica no código (migrateTargetGuard.mjs):
#   staging    → rszpnvmscehqapflaklv
#   production → ritmrjwrmcsofyugviil
# Default mode: connection-only (seguro). migrate = escolha explícita.
# Nunca: push main → DB desconhecido.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Migration target (staging|production|local)"
        required: true
        type: choice
        options:
          - staging
          - production
          - local
      mode:
        description: "connection-only | inventory-readonly (SELECT only) | migrate"
        required: true
        type: choice
        options:
          - connection-only
          - inventory-readonly
          - migrate
        default: connection-only
      dry_run:
        description: "Dry run (list pending files only) — só relevante para mode=migrate"
        required: false
        type: boolean
        default: false
      exclude_migrations:
        description: "CSV de filenames a excluir (ex. Phase A). Production: deve ficar vazio."
        required: false
        type: string
        default: ""
      skip_015:
        description: "Staging only: excluir 015 (default true = Phase A safe). Production ignora."
        required: false
        type: boolean
        default: true
      confirm_production:
        description: "Only for production: must equal I_UNDERSTAND"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  guard-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Fail-closed production confirmation
        if: ${{ github.event.inputs.target == 'production' && github.event.inputs.confirm_production != 'I_UNDERSTAND' }}
        run: |
          echo "ERRO: target=production requer confirm_production=I_UNDERSTAND"
          exit 1
      - name: Echo target (no secrets)
        run: |
          echo "Target: ${{ github.event.inputs.target }}"
          echo "Mode: ${{ github.event.inputs.mode }}"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"
          echo "skip_015: ${{ github.event.inputs.skip_015 }}"
          echo "exclude_migrations: ${{ github.event.inputs.exclude_migrations }}"
          if [ "${{ github.event.inputs.target }}" = "staging" ]; then
            echo "Expected ref: rszpnvmscehqapflaklv"
          elif [ "${{ github.event.inputs.target }}" = "production" ]; then
            echo "Expected ref: ritmrjwrmcsofyugviil"
          else
            echo "Expected ref: PIMO_SUPABASE_PROJECT_REF_LOCAL (secret)"
          fi

      - name: Fail-closed — inventory-readonly só em staging
        if: ${{ github.event.inputs.mode == 'inventory-readonly' && github.event.inputs.target != 'staging' }}
        run: |
          echo "ERRO: inventory-readonly apenas permitido com target=staging."
          exit 1

      - name: Fail-closed — production sem exclusões silenciosas
        if: ${{ github.event.inputs.target == 'production' && github.event.inputs.exclude_migrations != '' }}
        run: |
          echo "ERRO: exclude_migrations não é permitido em production (fail-closed)."
          echo "Production deve aplicar o conjunto completo quando o cutover estiver pronto."
          exit 1

  connection-only:
    needs: guard-inputs
    if: ${{ github.event.inputs.mode == 'connection-only' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: PostgreSQL connection probe (read-only SELECT 1)
        env:
          PIMO_MIGRATE_TARGET: ${{ github.event.inputs.target }}
          CONFIRM_PRODUCTION_MIGRATE: ${{ github.event.inputs.confirm_production }}
          PIMO_SUPABASE_PROJECT_REF_STAGING: rszpnvmscehqapflaklv
          PIMO_SUPABASE_PROJECT_REF_PRODUCTION: ritmrjwrmcsofyugviil
          PIMO_SUPABASE_PROJECT_REF_LOCAL: ${{ secrets.PIMO_SUPABASE_PROJECT_REF_LOCAL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Staging: nunca herdar SUPABASE_DB_PASSWORD do repositório.
          SUPABASE_DB_PASSWORD: ${{ github.event.inputs.target != 'staging' && secrets.SUPABASE_DB_PASSWORD || '' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_REGION: eu-central-1
        run: node scripts/connectionProbePg.mjs

  inventory-readonly:
    needs: guard-inputs
    if: ${{ github.event.inputs.mode == 'inventory-readonly' && github.event.inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Staging inventory (SELECT only)
        env:
          PIMO_MIGRATE_TARGET: staging
          PIMO_SUPABASE_PROJECT_REF_STAGING: rszpnvmscehqapflaklv
          PIMO_SUPABASE_PROJECT_REF_PRODUCTION: ritmrjwrmcsofyugviil
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ""
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_REGION: eu-central-1
        run: node scripts/inventoryStagingReadOnly.mjs

  migrate:
    needs: guard-inputs
    if: ${{ github.event.inputs.mode == 'migrate' }}
    runs-on: ubuntu-latest
    # REQUIRES EXTERNAL CONFIGURATION: Environments GitHub "staging" / "production"
    # com secrets ISOLADOS (nunca partilhar DATABASE_URL de production no environment staging).
    environment: ${{ github.event.inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve PIMO_MIGRATE_EXCLUDE (fail-closed)
        id: migrate_exclude
        run: |
          TARGET="${{ github.event.inputs.target }}"
          EXCLUDE="${{ github.event.inputs.exclude_migrations }}"
          SKIP015="${{ github.event.inputs.skip_015 }}"
          FILE_015="015_revoke_industrial_anon_write.sql"

          if [ "$TARGET" = "production" ]; then
            if [ -n "$(printf '%s' "$EXCLUDE" | tr -d '[:space:]')" ]; then
              echo "ERRO: exclude_migrations não permitido em production."
              exit 1
            fi
            if [ "$SKIP015" = "true" ]; then
              echo "skip_015 ignorado em production (conjunto completo)."
            fi
            echo "exclude=" >> "$GITHUB_OUTPUT"
            echo "Resolved exclude: (vazio — production)"
            exit 0
          fi

          RESULT="$EXCLUDE"
          if [ "$TARGET" = "staging" ] && [ "$SKIP015" = "true" ]; then
            case ",${RESULT}," in
              *",${FILE_015},"*) ;;
              *)
                if [ -n "$(printf '%s' "$RESULT" | tr -d '[:space:]')" ]; then
                  RESULT="${RESULT},${FILE_015}"
                else
                  RESULT="${FILE_015}"
                fi
                ;;
            esac
          fi

          echo "exclude=${RESULT}" >> "$GITHUB_OUTPUT"
          echo "Resolved exclude: ${RESULT:-"(vazio)"}"

      - name: List migrations
        run: |
          echo "Migrations em supabase/migrations:"
          ls -1 supabase/migrations/*.sql | sort
          echo "Target: ${{ github.event.inputs.target }}"
          echo "Mode: migrate"
          echo "PIMO_MIGRATE_EXCLUDE: ${{ steps.migrate_exclude.outputs.exclude }}"

      - name: Apply migrations (Postgres direct)
        env:
          PIMO_MIGRATE_TARGET: ${{ github.event.inputs.target }}
          PIMO_MIGRATE_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          PIMO_MIGRATE_EXCLUDE: ${{ steps.migrate_exclude.outputs.exclude }}
          CONFIRM_PRODUCTION_MIGRATE: ${{ github.event.inputs.confirm_production }}
          # Allowlist canónica reforçada (deve coincidir com migrateTargetGuard.mjs)
          PIMO_SUPABASE_PROJECT_REF_STAGING: rszpnvmscehqapflaklv
          PIMO_SUPABASE_PROJECT_REF_PRODUCTION: ritmrjwrmcsofyugviil
          PIMO_SUPABASE_PROJECT_REF_LOCAL: ${{ secrets.PIMO_SUPABASE_PROJECT_REF_LOCAL }}
          # Credenciais — APENAS do GitHub Environment seleccionado
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Staging: nunca herdar SUPABASE_DB_PASSWORD do repositório.
          # Production/local: manter resolução actual (Environment → repo).
          SUPABASE_DB_PASSWORD: ${{ github.event.inputs.target != 'staging' && secrets.SUPABASE_DB_PASSWORD || '' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_REGION: eu-central-1
        run: node scripts/applyMigrationsPg.mjs

      - name: Verify industrial tables (REST)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          API_KEY="${SUPABASE_SERVICE_ROLE_KEY:-$VITE_SUPABASE_ANON_KEY}"
          if [ -z "$API_KEY" ]; then
            echo "ERRO: VITE_SUPABASE_ANON_KEY ou SUPABASE_SERVICE_ROLE_KEY em falta para verificação."
            exit 1
          fi
          # Não imprimir keys; apenas host da URL
          echo "REST verify host: $(echo "$VITE_SUPABASE_URL" | sed -E 's#https://([^/]+).*#\1#')"
          TABLES=(
            industrial_work_orders
            industrial_work_order_tasks
            industrial_work_order_events
            industrial_piece_operations
            industrial_piece_quality
            industrial_piece_time_entries
            system_settings
            system_events
          )
          for table in "${TABLES[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${API_KEY}" \
              -H "Authorization: Bearer ${API_KEY}" \
              "${VITE_SUPABASE_URL}/rest/v1/${table}?limit=1")
            echo "${table} -> HTTP ${code}"
            if [ "$code" != "200" ]; then
              echo "ERRO: tabela ${table} inacessível"
              exit 1
            fi
          done

      - name: Validate industrial metadata (Postgres)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          PIMO_MIGRATE_TARGET: ${{ github.event.inputs.target }}
          CONFIRM_PRODUCTION_MIGRATE: ${{ github.event.inputs.confirm_production }}
          PIMO_SUPABASE_PROJECT_REF_STAGING: rszpnvmscehqapflaklv
          PIMO_SUPABASE_PROJECT_REF_PRODUCTION: ritmrjwrmcsofyugviil
          PIMO_SUPABASE_PROJECT_REF_LOCAL: ${{ secrets.PIMO_SUPABASE_PROJECT_REF_LOCAL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ github.event.inputs.target != 'staging' && secrets.SUPABASE_DB_PASSWORD || '' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_REGION: eu-central-1
        run: node scripts/validateIndustrialMetadata.mjs
