name: Verify

# Lint, typecheck e suite completa — bloqueante (suite 100% verde desde Fase 1 fechada).
# Qualquer falha em lint, tsc ou test falha o job e bloqueia merge/push checks.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mesma versao do deploy.yml, para o CI validar o que o deploy constroi.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Tests
        id: tests
        run: npm run test

      - name: Resumo
        if: always()
        run: |
          {
            echo "| Passo | Resultado |"
            echo "| --- | --- |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Testes | ${{ steps.tests.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
