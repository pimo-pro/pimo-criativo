name: Supabase Keepalive

on:
  schedule:
    # Diário 08:00 UTC — o Free Plan exige actividade DB distribuída na semana
    # (1x/semana NÃO chega; docs: "a few user requests each day").
    - cron: '0 8 * * *'
  workflow_dispatch: {}

# Mantém activos os projectos Free (pause por inactividade ~7 dias):
#   - Staging:    rszpnvmscehqapflaklv (PIMO-Staging)
#   - Production: ritmrjwrmcsofyugviil (pimo-industrial)
#
# Pré-requisito: se o projecto já estiver pausado, fazer Resume no dashboard
# Supabase ANTES — o keepalive não consegue reactivar DNS/API pausados.
# Tabela: public.system_settings (SELECT via REST + anon key).

jobs:
  keepalive-staging:
    runs-on: ubuntu-latest
    name: Ping Staging (PIMO-Staging)
    steps:
      - name: Ping REST system_settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          EXPECTED_REF: rszpnvmscehqapflaklv
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERRO: secrets SUPABASE_STAGING_URL / SUPABASE_STAGING_ANON_KEY em falta."
            exit 1
          fi
          case "${SUPABASE_URL}" in
            *"${EXPECTED_REF}"*) ;;
            *)
              echo "ERRO: SUPABASE_STAGING_URL não contém o ref esperado (${EXPECTED_REF})."
              echo "URL host: $(echo "${SUPABASE_URL}" | sed -E 's#https://([^/]+).*#\1#')"
              exit 1
              ;;
          esac
          echo "Ping staging host: $(echo "${SUPABASE_URL}" | sed -E 's#https://([^/]+).*#\1#')"
          endpoint="${SUPABASE_URL}/rest/v1/system_settings?select=*&limit=1"
          ok=0
          for attempt in 1 2 3; do
            echo "Tentativa ${attempt}/3..."
            body_file="$(mktemp)"
            code="$(curl -sS -o "${body_file}" -w "%{http_code}" \
              "${endpoint}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              || true)"
            echo "HTTP status: ${code}"
            if [ "${code}" = "200" ]; then
              ok=1
              rm -f "${body_file}"
              break
            fi
            echo "Corpo (primeiros 500 chars):"
            head -c 500 "${body_file}" || true
            echo
            rm -f "${body_file}"
            sleep $((attempt * 2))
          done
          if [ "${ok}" -ne 1 ]; then
            echo "ERRO: ping staging falhou após 3 tentativas (projecto pausado ou secrets/RLS)."
            exit 1
          fi
          echo "Staging keepalive OK."

  keepalive-production:
    runs-on: ubuntu-latest
    name: Ping Production (pimo-industrial)
    steps:
      - name: Ping REST system_settings
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EXPECTED_REF: ritmrjwrmcsofyugviil
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERRO: secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY em falta."
            exit 1
          fi
          case "${SUPABASE_URL}" in
            *"${EXPECTED_REF}"*) ;;
            *)
              echo "ERRO: VITE_SUPABASE_URL não contém o ref esperado (${EXPECTED_REF})."
              echo "URL host: $(echo "${SUPABASE_URL}" | sed -E 's#https://([^/]+).*#\1#')"
              exit 1
              ;;
          esac
          echo "Ping production host: $(echo "${SUPABASE_URL}" | sed -E 's#https://([^/]+).*#\1#')"
          endpoint="${SUPABASE_URL}/rest/v1/system_settings?select=*&limit=1"
          ok=0
          for attempt in 1 2 3; do
            echo "Tentativa ${attempt}/3..."
            body_file="$(mktemp)"
            code="$(curl -sS -o "${body_file}" -w "%{http_code}" \
              "${endpoint}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              || true)"
            echo "HTTP status: ${code}"
            if [ "${code}" = "200" ]; then
              ok=1
              rm -f "${body_file}"
              break
            fi
            echo "Corpo (primeiros 500 chars):"
            head -c 500 "${body_file}" || true
            echo
            rm -f "${body_file}"
            sleep $((attempt * 2))
          done
          if [ "${ok}" -ne 1 ]; then
            echo "ERRO: ping production falhou após 3 tentativas."
            exit 1
          fi
          echo "Production keepalive OK."
