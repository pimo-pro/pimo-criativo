
name: Publish and Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.version }}
      version_source: ${{ steps.meta.outputs.source }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "source=tag" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('version.json','utf8')); process.stdout.write(data.version || 'unknown');")"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "source=version.json" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $(cat "$GITHUB_OUTPUT" | tr '\n' ' ')"

      # Garante que o Footer/site exibem a tag publicada (nao um version.json antigo).
      - name: Stamp version.json from deploy tag
        if: github.ref_type == 'tag'
        env:
          DEPLOY_VERSION: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pad = (n) => String(n).padStart(2, "0");
          const now = new Date();
          const updatedAt = `${pad(now.getUTCDate())}.${pad(now.getUTCMonth() + 1)}.${now.getUTCFullYear()} ${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())} UTC`;
          const data = {
            version: process.env.DEPLOY_VERSION,
            updatedAt,
            tag: process.env.DEPLOY_VERSION,
            commit: process.env.DEPLOY_SHA,
            deployedAt: now.toISOString(),
          };
          const json = `${JSON.stringify(data, null, 2)}\n`;
          fs.writeFileSync("version.json", json, "utf8");
          fs.mkdirSync("public", { recursive: true });
          fs.writeFileSync("public/version.json", json, "utf8");
          console.log("Stamped version.json:", data.version, data.commit);
          NODE

      # Novidades do Sistema (/updates/news.json) — append automático em cada deploy.
      - name: Append Whats New news.json
        if: github.ref_type == 'tag'
        env:
          DEPLOY_VERSION: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_PUBLISHED_AT: ${{ github.event.head_commit.timestamp }}
        shell: bash
        run: |
          set -euo pipefail
          # Mensagem real (assunto + corpo): o append ignora "Publicação…" / chore(release).
          MSG="$(git log -1 --format=%B 2>/dev/null || true)"
          AUTHOR="$(git log -1 --format=%an 2>/dev/null || true)"
          export DEPLOY_COMMIT_MESSAGE="${MSG:-}"
          export DEPLOY_AUTHOR="${AUTHOR:-pimo-pro}"
          if [ -z "${DEPLOY_PUBLISHED_AT:-}" ]; then
            export DEPLOY_PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          fi
          node scripts/appendWhatsNewNews.mjs
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('public/updates/news.json','utf8')); if(!Array.isArray(j.news)||!j.news.length) process.exit(1); console.log('news.json OK', j.news[0].version, j.news.length);"

      - name: Install dependencies
        run: npm ci

      - name: Prepare production env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cat > .env.production <<EOF
          VITE_API_URL=https://pimo.pro
          VITE_TEXTURES_URL=https://pimo.pro/textures
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          VITE_PIMO_APP_ENV=production
          EOF
          # Phase 0: NÃO injectar PIMO_INTERNAL_API_SECRET / VITE_INTERNAL_API_SECRET no bundle.
          # Configurar PIMO_INTERNAL_API_SECRET no Hostinger (PHP) para /api/quotes e /api/final-report.
          # Health check horário: PIMO_EMAIL_HEALTH_SECRET no Hostinger + GitHub Secret (workflow email-health-check).

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pimo-dist-${{ github.run_number }}
          path: |
            dist/**
            version.json
          if-no-files-found: error
          retention-days: 14

      # FULL CLEAN dos artefactos frontend no servidor (public_html = conteúdo de dist/).
      # Não usa dangerous-clean-slate (apagaria textures/api data). Preserva dados persistentes.
      - name: Clean remote stale frontend assets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Hostinger: home FTP pode ser / ou /public_html. SamKirkland usa server-dir=/public_html/.
          # Apaga assets/industrial em ambos os caminhos e falha se ainda restarem JS hashed.
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set ftp:list-options -a;
            set net:max-retries 5;
            set net:timeout 60;
            set cmd:fail-exit no;
            open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ftp://${FTP_HOST};
            pwd;
            ls;
            rm -r -f assets;
            rm -r -f industrial;
            rm -r -f public_html/assets;
            rm -r -f public_html/industrial;
            rm -r -f /public_html/assets;
            rm -r -f /public_html/industrial;
            rm -f .ftp-deploy-sync-state.json;
            rm -f public_html/.ftp-deploy-sync-state.json;
            rm -f /public_html/.ftp-deploy-sync-state.json;
            rm -f *.js.map;
            rm -f public_html/*.js.map;
            echo '--- after wipe ---';
            pwd;
            ls;
            ls assets || echo 'assets gone at cwd';
            ls public_html/assets || echo 'assets gone at public_html';
            bye
          "
          echo "Remote clean done (dual-path assets/industrial + sync-state)"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: /public_html/
          # Nao usar true: apagaria textures e dados API persistentes.
          dangerous-clean-slate: false
          # Preserva JSON de projectos no servidor (legacy project-*.json e {nome}.json); PHP enviado pelo build.
          exclude: |
            **/textures/**
            **/api/data/**
            **/api/projects/data/*.json
            **/api/materials/**

      - name: Verify critical Vite assets on production
        shell: bash
        run: |
          set -euo pipefail
          CHUNK="$(ls dist/assets/cutLayoutPdf-*.js | head -n 1 | xargs -n1 basename)"
          echo "Expecting production asset: /assets/${CHUNK}"
          sleep 5
          URL="https://pimo.pro/assets/${CHUNK}"
          CODE="$(curl -sS -o /tmp/pimo_chunk.bin -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL")"
          HEAD="$(curl -sSI -H 'Cache-Control: no-cache' "$URL" | tr -d '\r')"
          echo "HTTP ${CODE}"
          echo "$HEAD" | head -n 20
          if [[ "$CODE" != "200" ]]; then
            echo "::error::cutLayoutPdf asset missing on production (${URL})"
            exit 1
          fi
          if echo "$HEAD" | grep -qi 'content-type:.*text/html'; then
            echo "::error::cutLayoutPdf returned text/html (SPA fallback) — assets not published"
            exit 1
          fi
          if head -c 64 /tmp/pimo_chunk.bin | grep -qiE '<!doctype|<html'; then
            echo "::error::cutLayoutPdf body looks like HTML"
            exit 1
          fi
          echo "OK: ${URL}"



