# TEMPORÁRIO — incidente Projetos Salvos.
# READ-ONLY: LIST + leitura local de metadados (ownerId/updatedAt). Sem upload/delete/move.
# Trigger: apenas workflow_dispatch.

name: Incident Projects Data Inventory (READ-ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install lftp + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp jq

      - name: FTP LIST + JSON metadata (READ-ONLY)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${FTP_HOST:-}" || -z "${FTP_USERNAME:-}" || -z "${FTP_PASSWORD:-}" ]]; then
            echo "::error::FTP secrets em falta (FTP_HOST / FTP_USERNAME / FTP_PASSWORD)"
            exit 1
          fi

          unset HISTFILE
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$WORK/files"

          # Descoberta rápida (igual ao deploy: fail-exit no, timeouts curtos)
          echo "=== FTP pwd + ls (descoberta) ==="
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set ftp:list-options -a;
            set net:max-retries 2;
            set net:timeout 25;
            set cmd:fail-exit no;
            open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ftp://${FTP_HOST};
            pwd;
            cls -1;
            echo '--- public_html ---';
            cls -1 public_html;
            echo '--- public_html/api/projects/data ---';
            cls -1 public_html/api/projects/data;
            echo '--- api/projects/data ---';
            cls -1 api/projects/data;
            echo '--- /public_html/api/projects/data ---';
            cls -1 /public_html/api/projects/data;
            bye
          " > "$WORK/discover.txt" 2>"$WORK/discover.err" || true

          echo "--- discover stdout ---"
          cat "$WORK/discover.txt"
          echo "--- discover stderr (redacted) ---"
          sed -E "s/${FTP_USERNAME}/REDACTED_USER/g; s/${FTP_HOST}/REDACTED_HOST/g; s/${FTP_PASSWORD}/REDACTED_PASS/g" "$WORK/discover.err" | head -n 40 || true

          FOUND_DIR=""
          for dir in "public_html/api/projects/data" "api/projects/data" "/public_html/api/projects/data"; do
            echo "=== LIST target: ${dir} ==="
            set +e
            lftp -c "
              set ssl:verify-certificate no;
              set ftp:passive-mode true;
              set net:max-retries 2;
              set net:timeout 25;
              set cmd:fail-exit yes;
              open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ftp://${FTP_HOST};
              cls -1 ${dir}/
            " > "$WORK/list_raw.txt" 2>"$WORK/list_err.txt"
            rc=$?
            set -e
            if [[ $rc -eq 0 ]]; then
              grep -E '\.json$' "$WORK/list_raw.txt" | sed 's/\r$//' | sort -u > "$WORK/list.txt" || true
              count="$(wc -l < "$WORK/list.txt" | tr -d ' ')"
              echo "LIST rc=0 path=${dir} json_lines=${count}"
              if [[ "$count" -gt 0 ]]; then
                FOUND_DIR="$dir"
                break
              fi
              # pasta existe mas vazia de json — registar e continuar a procurar
              if [[ ! -s "$WORK/list_raw.txt" ]]; then
                echo "LIST vazio (sem linhas)"
              else
                echo "LIST sem .json; primeiras linhas:"
                head -n 15 "$WORK/list_raw.txt"
                FOUND_DIR="$dir"
                break
              fi
            else
              echo "LIST falhou rc=${rc}"
              sed -E "s/${FTP_USERNAME}/REDACTED_USER/g; s/${FTP_HOST}/REDACTED_HOST/g; s/${FTP_PASSWORD}/REDACTED_PASS/g" "$WORK/list_err.txt" | head -n 10 || true
            fi
          done

          if [[ -z "$FOUND_DIR" ]]; then
            echo "::error::Não foi possível listar api/projects/data"
            exit 1
          fi

          mapfile -t ALL_NAMES < <(cat "$WORK/list.txt" 2>/dev/null || true)
          TOTAL=${#ALL_NAMES[@]}
          echo "=== RESUMO ==="
          echo "directory=${FOUND_DIR}"
          echo "json_count=${TOTAL}"

          if [[ "$TOTAL" -eq 0 ]]; then
            echo "Nenhum ficheiro .json encontrado (pasta acessível mas vazia de JSON)."
            echo "=== FIM INVENTÁRIO READ-ONLY ==="
            exit 0
          fi

          MAX_FULL=80
          NAMES=("${ALL_NAMES[@]}")
          if [[ "$TOTAL" -gt "$MAX_FULL" ]]; then
            echo "Amostra: total=${TOTAL} > ${MAX_FULL} — primeiros 40 + últimos 20"
            NAMES=("${ALL_NAMES[@]:0:40}" "${ALL_NAMES[@]: -20}")
          fi

          echo "=== FICHEIROS (nome | size_bytes | ownerId | updatedAt) ==="
          for name in "${NAMES[@]}"; do
            base="$(basename "$name")"
            if [[ ! "$base" =~ ^[A-Za-z0-9._%-]+\.json$ ]]; then
              echo "${base} | SKIP | invalid_name | "
              continue
            fi
            local_path="$WORK/files/$base"
            set +e
            lftp -c "
              set ssl:verify-certificate no;
              set ftp:passive-mode true;
              set net:max-retries 2;
              set net:timeout 40;
              set cmd:fail-exit yes;
              open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ftp://${FTP_HOST};
              get ${FOUND_DIR}/${base} -o ${local_path}
            " >/dev/null 2>"$WORK/get_err.txt"
            gre=$?
            set -e
            if [[ $gre -ne 0 || ! -f "$local_path" ]]; then
              echo "${base} | ERROR | get_failed | "
              continue
            fi
            size="$(wc -c < "$local_path" | tr -d ' ')"
            meta="$(jq -r '[
              (if .ownerId then (.ownerId|tostring) else "MISSING" end),
              (if .updatedAt then (.updatedAt|tostring) else "MISSING" end)
            ] | @tsv' "$local_path" 2>/dev/null || printf 'PARSE_ERROR\tPARSE_ERROR\n')"
            ownerId="$(printf '%s' "$meta" | cut -f1)"
            updatedAt="$(printf '%s' "$meta" | cut -f2)"
            echo "${base} | ${size} | ${ownerId} | ${updatedAt}"
            rm -f "$local_path"
          done

          echo "=== FIM INVENTÁRIO READ-ONLY ==="
